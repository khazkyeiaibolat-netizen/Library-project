{% extends 'base.html' %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="empty big">
  <p class="errcode">{{ code }}</p>
  <h1>{{ t('error.' ~ code) }}</h1>
  <p class="muted">{{ t('error.' ~ code ~ '_text') }}</p>
  <p><a class="btn" href="{{ url_for('public.index') }}">{{ t('error.home') }}</a></p>
</div>
{% endblock %}
